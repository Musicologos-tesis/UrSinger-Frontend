<app-auth-header [pageTitle]="'Iniciar sesión'"></app-auth-header>

<div class="page-container">
  <h1 class="title">Iniciar Sesión</h1>
  <p class="subtitle">Ingresa tus credenciales para continuar con el chequeo vocal.</p>

<div class="login-container">
  <form class="login-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        class="form-input"
        [value]="email()"
        (input)="updateEmail($any($event.target).value)"
        placeholder="tu@email.com"
        autocomplete="email"
        [disabled]="isLoading()"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        class="form-input"
        [value]="password()"
        (input)="updatePassword($any($event.target).value)"
        placeholder="••••••••"
        autocomplete="current-password"
        [disabled]="isLoading()"
      />
    </div>

    @if (errorMessage()) {
      <div class="error-message">
        ⚠️ {{ errorMessage() }}
      </div>
    }

    <button 
      type="submit" 
      class="btn-login"
      [disabled]="isLoading() || !email() || !password()"
    >
      {{ isLoading() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>

    <button 
      type="button" 
      class="btn-secondary"
      (click)="router.navigate(['/auth/register'])"
      [disabled]="isLoading()"
    >
      Registrarse
    </button>
  </form>

  <div class="login-info">
    <div class="info-card">
      <span class="info-icon">🎤</span>
      <div>
        <h3>¿Qué es el chequeo vocal?</h3>
        <p>Evaluamos tu rango vocal, estabilidad y calidad de voz para darte recomendaciones personalizadas.</p>
      </div>
    </div>
  </div>
</div>
</div>
