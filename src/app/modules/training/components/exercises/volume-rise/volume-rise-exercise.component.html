<div class="volume-rise-shell">
  @if (state === 'idle' || state === 'practicing') {
    <p class="volume-rise-hint">Sostén la nota y aumenta solo un poco la potencia. Completa 3 repeticiones en máximo 1 minuto.</p>
  }

  <app-generic-exercise
    [state]="state"
    [practicePrompt]="practicePrompt"
    [showTargetReference]="showTargetReference"
    [targetNote]="targetNote"
    [targetReferenceLabel]="targetReferenceLabel"
    [remainingSeconds]="remainingSeconds"
    [currentNote]="currentNote"
    [currentConfidence]="currentConfidence"
    [primaryCheckLabel]="primaryCheckLabel"
    [primaryOk]="primaryOk"
    [voiceDetected]="voiceDetected"
    [edgeConfidenceOk]="edgeConfidenceOk"
    [completionMet]="completionMet"
    [completionLabel]="completionLabel"
    [progressPercent]="progressPercent"
    (start)="start.emit()"
    (retry)="retry.emit()"
    (finish)="finish.emit()"
    (playNote)="playNote.emit()"
  />
</div>
