<app-auth-header 
  [pageTitle]="'Aprendizaje'"
  [showNavigation]="true" 
  [activeNav]="'training'"
  (navTraining)="goToTraining()"
  (navCheckup)="goToCheckup()"
  (navProfile)="goToProfile()"
  (navLogout)="logout()"
></app-auth-header>

<div class="page-container">
  <div class="practice-content">
    @if (isLoading()) {
      <div class="loading">
        <p>Cargando ejercicio...</p>
      </div>
    } @else if (error()) {
      <div class="error">
        <p>{{ error() }}</p>
        <button class="btn-back" (click)="goToTraining()">Volver al dashboard</button>
      </div>
    } @else if (exercise()) {
      <h1 class="title">{{ exercise()!.exerciseName }}</h1>
      <p class="subtitle">{{ exercise()!.description }}</p>

      <!-- Panel principal -->
      <div class="panel">
        <!-- Icono del micrófono a la izquierda -->
        <div class="mic-box">
          <div class="mic-circle" 
               [class.pulse]="state() === 'practicing'">
            <app-exercise-group-icon [groupNumber]="exercise()!.groupNumber"></app-exercise-group-icon>
          </div>
        </div>

        <!-- Contenido derecho -->
        <div class="right">
          <app-exercise-renderer
            [kind]="getExerciseKindForView()"
            [state]="state()"
            [practicePrompt]="practicePrompt()"
            [showTargetReference]="showTargetReference()"
            [targetNote]="targetNote()"
            [targetReferenceLabel]="targetReferenceLabel()"
            [remainingSeconds]="remainingSeconds()"
            [currentNote]="currentNote()"
            [currentConfidence]="currentConfidence()"
            [primaryCheckLabel]="primaryCheckLabel()"
            [primaryOk]="frameChecks().primaryOk"
            [voiceDetected]="frameChecks().voiceDetected"
            [edgeConfidenceOk]="frameChecks().edgeConfidenceOk"
            [completionMet]="isCompletionRequirementMet()"
            [completionLabel]="getCompletionCheckLabel()"
            [progressPercent]="getLiveProgressPercent()"
            [szRecordedDurationSec]="getSZRecordedDurationSec()"
            [szCurrentZDurationSec]="getSZCurrentZDurationSec()"
            [szFlowPhase]="getSZFlowPhase()"
            [szCountdown]="getSZCountdownValue()"
            (start)="startPractice()"
            (stopSZS)="stopSZSPhase()"
            (startSZHold)="startSZHoldPhase()"
            (retry)="retryPractice()"
            (finish)="finishExercise()"
            (playNote)="playTargetNote()"
          />
        </div>
      </div>
    }
  </div>
</div>
